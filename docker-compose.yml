services:
  postgres:
    image: postgres:16-alpine
    container_name: hireflow-postgres
    restart: always
    environment:
      POSTGRES_DB: hireflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hireflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hireflow-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hireflow_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B597034733776}
      AI_PROVIDER: ${AI_PROVIDER:-baseline}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-1.5-flash}
      SEED_DATA: ${SEED_DATA:-true}
    ports:
      - "8080:8080"
    volumes:
      - resume_uploads:/app/uploads/resumes

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hireflow-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  resume_uploads:
