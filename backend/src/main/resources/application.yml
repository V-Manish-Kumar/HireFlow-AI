server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: hireflow-ai
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hireflow_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B597034733776
    expiration-ms: 86400000 # 24 hours
  storage:
    upload-dir: ./uploads/resumes
  ai:
    provider: ${AI_PROVIDER:baseline}
    api-key: ${AI_API_KEY:}
    api-url: ${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
    model: ${AI_MODEL:gemini-1.5-flash}
  demo:
    seed-data: ${SEED_DATA:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
